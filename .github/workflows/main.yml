name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
        ruby-llm-version: ['1.14.0', '~> 1.16', '~> 2.0']

    env:
      RUBY_LLM_VERSION: ${{ matrix.ruby-llm-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec

    - name: Run linter
      run: bundle exec rubocop

    - name: Build gem
      run: gem build llm_classifier.gemspec

  # Publishes to RubyGems.org via trusted publishing (OIDC) when a vX.Y.Z tag is pushed.
  # The rubygems.org trusted publisher is bound to this workflow file and the "release" environment.
  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true

    # rake release tags and pushes whatever version.rb says, so refuse a tag that doesn't match it.
    - name: Check tag matches gem version
      run: |
        version=$(ruby -r ./lib/llm_classifier/version -e 'print LlmClassifier::VERSION')
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match lib/llm_classifier/version.rb ($version)"
          exit 1
        fi

    - name: Publish to RubyGems.org
      uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
